[workspace]
resolver = "3"
members = ["crates/mercs2_plasma_proto", "crates/mercs2_mp_api", "crates/mercs2_mp_server"]

[workspace.package]
edition = "2024"
publish = true
license = "MIT"
repository = "https://github.com/Mercenaries-Fan-Build/multiplayer-server"

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
